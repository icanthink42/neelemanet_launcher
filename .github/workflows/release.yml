name: Build player downloads
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: NeelemaNet-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: NeelemaNet-windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: NeelemaNet-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: NeelemaNet-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check published pack URLs
        shell: python
        run: |
          import pathlib, tomllib
          catalog = tomllib.loads(pathlib.Path('packs.toml').read_text())
          for pack in catalog['packs']:
              assert pack['url'].startswith('https://'), f"Host {pack['id']}'s ZIP and put its HTTPS URL in packs.toml before building player downloads."
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package download
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          mkdir -p dist
          if [[ "$BUILD_TARGET" == *apple* ]]; then
            mkdir -p 'dist/NeelemaNet.app/Contents/MacOS'
            cp "target/$BUILD_TARGET/release/neelemanet_launcher" 'dist/NeelemaNet.app/Contents/MacOS/NeelemaNet'
            cp packaging/Info.plist 'dist/NeelemaNet.app/Contents/Info.plist'
            codesign --force --deep --sign - dist/NeelemaNet.app
            ditto -c -k --keepParent dist/NeelemaNet.app "$ARTIFACT.zip"
          elif [[ "$BUILD_TARGET" == *windows* ]]; then
            cp "target/$BUILD_TARGET/release/neelemanet_launcher.exe" dist/NeelemaNet.exe
            7z a "$ARTIFACT.zip" ./dist/NeelemaNet.exe
          else
            cp "target/$BUILD_TARGET/release/neelemanet_launcher" dist/NeelemaNet
            tar -czf "$ARTIFACT.tar.gz" -C dist NeelemaNet
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
